HTML is defined as Hypertext Markup Language, and it is the foundation of every websites. In HTML, we have tags and elements. Tags are a pair of symbols contained in a pair of angle brackets, and these tags will contain contents for the web page. Elements are a combination of tags and contents; so if a tag has a content, it is called an element. There are many tags, and in every HTML document we must declare what type of HTML it is or what version:

    <!DOCTYPE HTML> 

This syntax is to declare the latest version of HTML for an HTML document. Now, every HTML document must also contain a root element,

    <HTML></HTML>

This is the syntax for the root element, and for the last tag will always contain a forward slash, except hr and line break. This root element will contain the contents of your web page through the head and body,

    <head></head>
    <body></body>

This is the head and body tags. The head will contain the information about your web page, while the body will contain the contents of your web page. In the head, you can initialize the title of your website through

    <title></title>

This can assign the title of your website. Now for the head, there are a lot of things you can do, like initializing a header text, paragraph text, and host hyperlinks for links,

    <h1-h6></h1-h6> (goes from h1-h6, depends on the size of the header)
    <p></p> (static paragraphs)
    <pre></pre> (dynamic, meaning whatever is changed in the code editor will 
                be implemented on the website)
    <a></a> (hyperlinks)

You can also have line breaks and hr, or to have a big long line to separate something

    <br> (line break)
    <hr> 

You can also have nested tags,

    <p>
        <br>
            <p></p>
        </br>
    </p>

To further expand the a tag or anchor tag, and most of HTML tags have attributes, typically name value pair, that modifies a behaviour of an element,

    <a href=""></a>

The href is the attribute and is used to contain links for the anchor to be clicked and directed into that link. The meaning of href is hypertext reference. To put it simply, the attributes will put a purpose to every elements or imply what they should do. These attributes are optional, and here's a list

    href="" - for referencing links, although this can do a lot
                - mailto:email.here : for direct emailing
                - filepath/file : for linking to another HTML document
    target="_" - window manipulation
                - _self : open in the same tab
                - _blank : open in a new tab
                - _parent : opens link in parent frame
                - _top : opens the link in full body of the window
    title="tooltip" - this is for tooltips when hovered to a button


----------------------------------------------------------------------------------------
Image
    You can import or display images using the tag,
    
        <img 
        src="file_path"
        alt="text_here"
        height/width="number"
        >

    And it doesn't need a closing tag. It also has attributes such
    as src to reference your image, alternative to show what the image 
    is or any text if the image does not show, and height and width to 
    control how the image will be in the web page. Also, if you only 
    have height included and not the width, the width will be automatically 
    adjusted, vice-versa. And with image sources, you can place them or 
    make them as hyperlinks using the a tag with or without attributes.

----------------------------------------------------------------------------------------

Audio
    You  can import or display the controls of an audio using the
    tag,
    
        <audio controls autoplay muted loop>
            <source src="file_path" (optional) type="type_of_audio
            :audio/mpeg(mp3)
            :audio/wav(wav)
            ...
            "
            >
        </audio>

    With a pair of audio tags, you can import any songs from your 
    system. Also, in sourcing or referencing your audio, you need
    to have a tag called source, and it does not have an ending tag,
    to source your audio by using the attribute such as src. In the
    attributes of the audio tag, we have control to display the
    controls of the audio such as play, volume, playback, etc. And
    then we have the autoplay, muted, and loop. You can also have
    fallbacks for backup songs if the original song is corrupted
    or a user web browser's does not support the extension, and to 
    have this fallback is to use another source tag with either the 
    song in another extension or the same.

----------------------------------------------------------------------------------------

Video 
    
    You can import a pair of video tag to source a video, and how
    you do it is the same as you do in audio and image, wherein
    you can ajust the height or width of the video within the video
    tag, and you can also source the video through the video tag
    or via the source tag inside the video tag.

        <video
            height/width="0px"
            controls
            autoplay
            src="path_here"
            loop
            muted        
        >
            <source src="path_here" type="audio/mp4/webm/...">
        </video>

    You can also make the video as hyperlink using the pair of 
    a tags.

----------------------------------------------------------------------------------------

Favicon

        A favicon is the icon in the head of your webpage. You
        can have a favicon by having the link tag,

            <link rel="icon" type="image/png" href="file_path">

        This link tag, a self-closing tag (which are tags that
        does not have a pair), links your document to an external
        source. The relationship tag or the rel specifies what 
        you will import. You also have the type tag to specify 
        the extension of your file, and then the href tag.

        Most modern web browsers accept exensions such as ico,
        png, gif, jpg, and svg. And the recommended dimensions
        of the icon is typically 96px by 96px or 176px by 176px
        if you edit it.

----------------------------------------------------------------------------------------

Text Formatting

        This is how we put special emphasis on texts or words.
        These formats are enclosed within paragraph tags or
        pre tags, and are tags themselves which needs a closing
        tag. We have bold, italic, underline, deleted, big, small
        subscript, superscript, monospace, and mark or highlight 
        a text.

    Syntax:

        <b></b> - bold text
        <i></i> - italic text
        <u></u> - underlined text
        <del></del> - deleted text or cross a line in  a word
        <big></big> - big text
        <small></small> - small text
        <sub></sub> - subscript text
        <sup></sup> - superscript text
        <tt></tt> - monospace text
        <mark></mark> - highlight text

----------------------------------------------------------------------------------------

Span and Div

        Both span and div are used to group elements and style them with CSS, however 
        their key differences lies on how they group elements. In a span, you can only
        style elements that are at the same line as the span tags, making it an inline 
        container; while div is a block container that groups multiple elements and
        style them, and also div is short for division. And after the div element, you'll
        have a new line while span does not.
    Syntax:
        <span></span>
        <div></div>


----------------------------------------------------------------------------------------

Lists

        A list is a way to group items or texts together. There are three lists in html,
        unordered list, ordered list, and description list. These lists can be styled 
        using CSS. The unordered lists and ordered lists has li or list items, which
        in ul or unoredered lists are grouped within bullet points while ordered lists
        follow a set of rules, which is sequencial, and that is grouped within numbers.
        The description lists are terms with descriptions. They're enclosed within a
        pair of dl tags, and dt for terms and dd for their definitions.

    Syntax:
        <ul></ul> - unordered list
        <ol></ol> - ordered list
        <dl></dl> - description list
        <li></li> - list item
        <dt></dt> - description term
        <dd></dd> - description definition

----------------------------------------------------------------------------------------

Table

        A table is a way for us to represent data. In html, we have a pair of table tags
        for defining a table, and then tr for table rows, th for table headers, and then
        td for table data. We also have attributes for these such as align and then if
        center, right, or left. 

    Syntax:
        <table>
            <tr>
                <th></th>
                <td></td>
            </tr>
        </table>

----------------------------------------------------------------------------------------

Button

        A button is a clickable symbol. In HTML, it is implemented within button tags,
        and that button tag can either be a hyperlink or have something to do with JS
        like calling a function.

        These buttons have a lot of attributes like font-size for the button's width
        height, color for the font's color, border-radius for the rounded corners, 
        and then onclick when calling functions.
    Syntax:
        <button 
            onclick
            font-size
            color
            border-radius
        >
            click_me
        </button>

----------------------------------------------------------------------------------------
        
ID
        Every HTML tag can have their own unique id with the id attribute. With this id,
        it can be used with JS to manipulate elements.
    
    Syntax:
        <button id="unique" onclick="changeName()">Click me</button>

        <script>
            function changeName(){
                document.getElementById("unique").innerHTML = "Hello!"
            }
        </script>

        The document class can be used as variable assignments to elements.

----------------------------------------------------------------------------------------

Form

        A form is where users can have inputs to pass into a source. In HTML
        a form is a pair of tags, and inside those tags we can put input, label,
        select and option, textarea, and so on. There are a lot of attributes in
        each of these tags, specifically in input because there are too many types
        of user input although they can all be understood.

    Syntax:
        <form></form>
            action="" - this is where the data is sent
            method="" - requests specification, [POST] if condidential, and [GET]
                        if insensitive.
            enctype="multipart/form-data" - basically chops the file input into pieces
        
        <label></label>
            for="id" - just like in button, wherein if you click this then it will
                       direct you
        
        <input> (self-closing tag)
            type="" - specify what type of input it will be
                "text" - self-explanatory
                "password" - self-explanatory
                "email" - self-explanatory
                "date" - self-explanatory
                "number" - digits
                "tel" - phone no.
                "radio" - buttons
                "checkbox" - self-explanatory
                "reset" - clear form
                "submit" - submit data
                "file" - file inputs
            placeholder="" - preview of what the user should enter
            min="" - min number required
            max="" - limit
            minlenght="" - of a string
            maxlenght="" - of a string
            name="" - for grouping of data
            required - a field will be requirede of input
            pattern="[start-end]{minlength}symbol/void" - make patterns required
            value="" value of the element
            accept="" makes custom file ext requirements for file inputs
        <select>
            <option></option>
                value="" - value of the element
        </select>
        <textarea></textarea>
            row="" - specify the size of the box in terms of rows
            cols="" - specify the size of the box in terms of columns


----------------------------------------------------------------------------------------

Header, Footer, Main

        Header is the introductory statement of webpages, while footer is the ending, and
        main is where your whole content is displayed. Inside the header are typically
        navigation panels, and in the footer are copyright symbol, author, and about
        the author or email.
    
    Syntax:
        <header></header>
        <main></main>
        <footer></footer>
