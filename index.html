<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>
<body>

                <input type="text" name="last_name" id="LN" placeholder="Enter Last Name" maxlength="12" required><br>

                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                    <option value="19">19</option>
                    <option value="20">20</option>
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>

                <select name="month" required>
                    <option hidden value="">Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">Nobember</option>
                    <option value="December">December</option>
                </select>
                <select name="year" required>
                    <option hidden value="">Year</option>
                    <option value="1990">1990</option>
                    <option value="1991">1991</option>
                    <option value="1992">1992</option>
                    <option value="1993">1993</option>
                    <option value="1994">1994</option>
                    <option value="1995">1995</option>
                    <option value="1996">1996</option>

                <label for="m_gender">Gender</label>
                <input type="radio" value="Male" name="gender" id="m_gender">
                <label>Male</label>
                <input type="radio" value="Female" name="gender" id="fm_gender">
                <label>Female</label><br>
        
                <label for="count">Country</label>
                <select name="country" id="count" required>
                    <option hidden value="">Country</option>
                    <option value="China">China</option>
                    <option value="Japan">Japan</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Mongolia">Mongolia</option>
                    <option value="Philippines">Philippines</option>
                    <option value="Thailand">Thailand</option>
                    <option value="Indonesia">Indonesia</option>
                    <option value="Vietnam">Vietnam</option>
                    <option value="India">India</option>
                    <option value="Pakistan">Pakistan</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Sri Lanka">Sri Lanka</option>
                    <option value="Kazakhstan">Kazakhstan</option>
                    <option value="Uzbekistan">Uzbekistan</option>
                    <option value="Turkmenistan">Turkmenistan</option>
                    <option value="Kyrgyzstan">Kyrgyzstan</option>

                    <option value="UAE">UAE</option>
                    <option value="Iran">Iran</option>
                    <option value="Turkey">Turkey</option>
                </select><br>
        
                <label for="em">E-mail</label>
                <input type="email" name="email" id="em" placeholder="Enter E-mail" required><br>
        
                <label for="no">Phone</label>
                <input type="tel" name="phone" id="no" placeholder="Enter Phone" minlength="11" maxlength="11" pattern="\d*" inputmode="numeric" title="Digits only" required><br>
        
                <label for="pwd">Password</label>
                <input type="password" name="password" id="pwd" minlength="8" maxlength="12" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$" title="Atleast 1 uppercase, 1 lowercase, one number, and one special character" required><br>
        
                <label for="chkpwd">Confirm Password</label>
                <input type="password" name="cpassword" id="chkpwd" minlength="8" maxlength="12" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$" title="Atleast 1 uppercase, 1 lowercase, one number, and one special character" required><br>
        
                <input type="checkbox" name="terms" id="TOU" required>
                <label for="TOU">I Agree to the Terms of use</label><br>
        
                <input class="submit" type="submit" value="Submit">
                <input class="submit" type="reset" value="Cancel">
            </form>  
        </div>
    </div> 

    <script>
        function confirmMoPassword(){
            const password = document.getElementById("pwd").value;
            const cpassword = document.getElementById("chkpwd").value;

            if (password !== cpassword){
                alert("Mali Password mo sir!");
                return false;
            }
            return true;
        }
    </script>


</body>
</html>
